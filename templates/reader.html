<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>{{ comic_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/reader.css') }}">
</head>

<body>
    <div id="ui-bar" class="ui-overlay">
        <div class="ui-left">
            <a href="{{ back_url }}" class="icon-btn" id="back-btn" title="Back to Library" tabindex="0">←</a>
            <div class="text-container">
                <h1>{{ comic_name }}</h1>
                <div id="page-counter">1 / ?</div>
            </div>
        </div>
        <div class="ui-right">
            <div class="zoom-controls">
                <button id="zoom-out-btn" class="zoom-btn" title="Zoom Out (−)" tabindex="0">−</button>
                <span id="zoom-display" class="zoom-level-display">1.0×</span>
                <button id="zoom-in-btn" class="zoom-btn" title="Zoom In (+)" tabindex="0">+</button>
                <button id="zoom-reset-btn" class="zoom-btn" title="Reset Zoom (0)" tabindex="0">↺</button>
            </div>
            <button id="fullscreen-btn" class="icon-btn" title="Toggle Fullscreen (F)" tabindex="0">⛶</button>
        </div>
    </div>

    <div class="comic-container" id="slider-container"></div>

    <!-- Zoom indicator pill -->
    <div id="zoom-indicator" class="zoom-indicator">1.0×</div>

    <!-- Preload progress bar -->
    <div id="preload-bar" class="preload-bar"><div id="preload-bar-fill" class="preload-bar-fill"></div></div>
    <div id="preload-label" class="preload-bar-label"></div>

    <script>
        window.READER_CONFIG = {
            images: {{ images | tojson }},
            fileId: {{ file_id | tojson }}
        };
    </script>
    <script src="{{ url_for('static', filename='js/reader.js') }}"></script>
</body>

</html>
